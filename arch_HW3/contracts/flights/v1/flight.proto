syntax = "proto3";
package flights.v1;
import "google/protobuf/timestamp.proto";

service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);

  rpc GetFlight(GetFlightRequest) returns (Flight);

  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);

  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);

  rpc CreateFlight(CreateFlightRequest) returns (Flight);

  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
  rpc Health(HealthRequest) returns (HealthResponse);
}
enum FlightStatus { FLIGHT_STATUS_UNSPECIFIED = 0; SCHEDULED = 1; DEPARTED = 2; CANCELLED = 3; COMPLETED = 4; }
enum ReservationStatus { RESERVATION_STATUS_UNSPECIFIED = 0; ACTIVE = 1; RELEASED = 2; EXPIRED = 3; }
message Flight {
  string id = 1;
  string airline_code = 2;
  string airline_name = 3;
  string flight_number = 4;
  string origin = 5;
  string destination = 6;
  google.protobuf.Timestamp departure_time = 7;
  google.protobuf.Timestamp arrival_time = 8;
  int32 total_seats = 9;
  int32 available_seats = 10;
  string price = 11;
  FlightStatus status = 12;
}
message SearchFlightsRequest { string origin = 1; string destination = 2; optional string date = 3; }
message SearchFlightsResponse { repeated Flight flights = 1; }
message GetFlightRequest { string flight_id = 1; }
message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
  optional string expected_price = 4;
}
message SeatReservation {
  string id = 1;
  string booking_id = 2;
  string flight_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
  string price_at_reservation = 6;
  google.protobuf.Timestamp created_at = 7;
}
message ReleaseReservationRequest { string booking_id = 1; }
message ReleaseReservationResponse { string booking_id = 1; ReservationStatus status = 2; bool changed = 3; }
message FlightInput {
  string airline_code = 1;
  string airline_name = 2;
  string flight_number = 3;
  string origin = 4;
  string destination = 5;
  google.protobuf.Timestamp departure_time = 6;
  google.protobuf.Timestamp arrival_time = 7;
  int32 total_seats = 8;
  string price = 9;
  FlightStatus status = 10;
}
message CreateFlightRequest { FlightInput flight = 1; }
message UpdateFlightRequest { string flight_id = 1; FlightInput flight = 2; }
message HealthRequest {}
message HealthResponse { bool database_ok = 1; bool cache_ok = 2; }
