name: arch_HW2 — contract, CRUD and orders

on:
  push:
    paths:
      - 'arch_HW2/**'
      - '.github/workflows/arch_HW2.yml'
  pull_request:
    paths:
      - 'arch_HW2/**'
      - '.github/workflows/arch_HW2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: arch_HW2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arch_HW2/requirements-dev.txt
      - name: Install contract-check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test generated HTTP contract, business rules and concurrency with PostgreSQL
        run: docker compose --profile test run --rm tests
      - name: Verify generated code is ignored
        run: |
          git check-ignore target/generated-sources/openapi/src/main/java/ru/marketplace/generated/model/ProductCreate.java
          test -z "$(git ls-files target)"
      - name: Build and start application and PostgreSQL
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Show startup and Flyway migration logs
        run: docker compose logs --no-color --no-log-prefix api db
      - name: Real E2E with SELECT evidence
        run: python scripts/demo.py --evidence evidence/e2e.json
      - name: Validate live responses against source OpenAPI
        run: python scripts/verify_contract.py
      - name: Upload test and sanitized E2E reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arch_HW2-verification
          path: |
            arch_HW2/target/surefire-reports/
            arch_HW2/evidence/e2e.json
      - name: Show failure logs
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Stop disposable CI containers
        if: always()
        run: docker compose --profile test --profile tools down --volumes --remove-orphans
