          type: boolean
      description: valid_until строго позже valid_from. Для PERCENTAGE discount_value ≤ 100. При скидке >70% предоставляется
        0% (полная цена). Эти межполевые ограничения проверяются до записи. Скидка округляется HALF_UP до копеек;
        процентная скидка дополнительно ограничена 70% суммы с округлением границы вниз, чтобы не превышать её на
