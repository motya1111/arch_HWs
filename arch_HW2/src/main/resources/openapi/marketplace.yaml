openapi: 3.0.3
info:
  title: Marketplace — contract-first API
  version: 1.0.0
  description: Каталог, заказы, промокоды, JWT и роли. Деньги — точные decimal, одна условная валюта RUB. В HTTP
    поле price — JSON number; максимум 2 значащих дробных знака. Все времена — RFC 3339 с часовым поясом. Неизвестные
    JSON-поля и несоответствующие типы запрещены. Каждый ответ содержит UUID X-Request-Id. Все ошибки имеют ErrorResponse.
    Размер JSON body ограничен 1048576 байтами; превышение даёт VALIDATION_ERROR (400).
servers:
- url: /
  description: Текущий адрес API; Docker Compose по умолчанию http://localhost:8081
security:
- bearerAuth: []
tags:
- name: Health
- name: Auth
- name: Products
- name: Orders
- name: Promos
paths:
  /health:
    get:
      tags:
      - Health
      operationId: health
      summary: Проверка процесса и подключения к БД
      description: ''
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Регистрация USER / SELLER
      description: ''
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: 'Вход: access + refresh JWT'
      description: ''
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refresh
      summary: Одноразовая ротация refresh JWT
      description: 'Предыдущий refresh token отзывается в той же транзакции; повторное использование: REFRESH_TOKEN_INVALID.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /products:
    post:
      tags:
      - Products
      operationId: createProduct
      summary: Создать товар
      description: 'Роли: SELLER, ADMIN. '
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
    get:
      tags:
      - Products
      operationId: listProducts
      summary: Список товаров
      description: 'Роли: USER, SELLER, ADMIN. Все статусы, включая ARCHIVED, доступны всем трём ролям. Фильтры
        объединяются AND. Сортировка created_at, id; totalElements считается после фильтрации.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: &id001
      - USER
      - SELLER
      - ADMIN
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
          maximum: 1000000
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 20
          maximum: 100
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*$
        description: Точное, регистрозависимое совпадение
  /products/{id}:
    get:
      tags:
      - Products
      operationId: getProduct
      summary: Получить товар
      description: 'Роли: USER, SELLER, ADMIN. '
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: *id001
      parameters:
      - &id002
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
      - Products
      operationId: updateProduct
      summary: Полностью обновить товар
      description: 'Роли: SELLER, ADMIN. '
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      parameters:
      - *id002
    delete:
      tags:
      - Products
      operationId: archiveProduct
      summary: Мягко удалить товар
      description: 'Роли: SELLER, ADMIN. SELLER — только свой, ADMIN — любой. Запись сохраняется, status = ARCHIVED.
        Повторное архивирование: 204.'
      responses:
        '204':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - SELLER
      - ADMIN
      parameters:
      - *id002
  /orders:
    post:
      tags:
      - Orders
      operationId: createOrder
      summary: Создать заказ
      description: 'Роли: USER, ADMIN. Порядок проверок: частота CREATE_ORDER → активный заказ → каталог → остатки
        → резерв → снимок цен → промокод → запись операции. Всё в одной транзакции. N задаётся ORDER_RATE_LIMIT_MINUTES.
        Неудачные запросы не записывают операцию.'
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PromoError'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /orders/{id}:
    get:
      tags:
      - Orders
      operationId: getOrder
      summary: Получить заказ
      description: 'Роли: USER, ADMIN. USER — свой, ADMIN — любой.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - USER
      - ADMIN
      parameters:
      - *id002
    put:
      tags:
      - Orders
      operationId: updateOrder
      summary: Заменить позиции заказа
      description: 'Роли: USER, ADMIN. Только CREATED. Сначала владелец и состояние, затем частота UPDATE_ORDER.
        Возврат старых остатков, новый резерв, новые снимки текущих цен и пересчёт выполняются атомарно. Невалидный/истёкший
        промокод: PROMO_CODE_INVALID и откат. Если сумма ниже минимума, скидка снимается и счётчик использования
        уменьшается. Существующий заказ учитывает своё занятое использование и не расходует второе. ADMIN действует
        с лимитом владельца заказа.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PromoError'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      parameters:
      - *id002
  /orders/{id}/cancel:
    post:
      tags:
      - Orders
      operationId: cancelOrder
      summary: Отменить заказ
      description: 'Роли: USER, ADMIN. Только CREATED и PAYMENT_PENDING. Атомарно возвращаются остатки и использование
        промокода, status = CANCELED. Повторная отмена: INVALID_STATE_TRANSITION.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - USER
      - ADMIN
      parameters:
      - *id002
  /orders/{id}/status:
    patch:
      tags:
      - Orders
      operationId: changeOrderStatus
      summary: Перевести заказ на следующий этап
      description: 'Роли: ADMIN. Технический endpoint для демонстрации конечного автомата; интеграция оплаты вне
        задания. Только CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED. Отмена — через /cancel.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      parameters:
      - *id002
  /promo-codes:
    post:
      tags:
      - Promos
      operationId: createPromoCode
      summary: Создать промокод
      description: 'Роли: SELLER, ADMIN. '
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT с claims sub, role, token_type=access; 15 минут по умолчанию. Refresh JWT принимается
        только /auth/refresh.
  headers:
    RequestId:
      description: UUID запроса, сгенерированный сервером
      schema:
        type: string
        format: uuid
  schemas:
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    DiscountType:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    ErrorCode:
      type: string
      enum:
      - PRODUCT_NOT_FOUND
      - PRODUCT_INACTIVE
      - ORDER_NOT_FOUND
      - ORDER_LIMIT_EXCEEDED
      - ORDER_HAS_ACTIVE
      - INVALID_STATE_TRANSITION
      - INSUFFICIENT_STOCK
      - PROMO_CODE_INVALID
      - PROMO_CODE_MIN_AMOUNT
      - ORDER_OWNERSHIP_VIOLATION
      - VALIDATION_ERROR
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - REFRESH_TOKEN_INVALID
      - ACCESS_DENIED
      - INVALID_CREDENTIALS
      - EMAIL_ALREADY_EXISTS
      - PROMO_CODE_ALREADY_EXISTS
      - AMOUNT_LIMIT_EXCEEDED
      - METHOD_NOT_ALLOWED
      - ROUTE_NOT_FOUND
      - INTERNAL_ERROR
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error_code
      - message
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?![\s\S]*\x00)[\s\S]*\S[\s\S]*$
        description:
          type: string
          maxLength: 4000
          pattern: ^[^\x00]*$
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: '@jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^(?![\s\S]*\x00)[\s\S]*\S[\s\S]*$
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          nullable: true
          description: При создании отсутствие/null означает текущего пользователя. Назначать другого владельца
            может только ADMIN. При PUT отсутствие/null сохраняет владельца.
      description: Полное представление для записи; PUT заменяет поля, отсутствие description означает null. Цены
        с точностью до 2 знаков. Неизвестные поля запрещены.
      example:
        name: Книга
        description: null
        price: 100.0
        stock: 10
        category: Books
        status: ACTIVE
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?![\s\S]*\x00)[\s\S]*\S[\s\S]*$
        description:
          type: string
          maxLength: 4000
          pattern: ^[^\x00]*$
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-field-extra-annotation: '@jakarta.validation.constraints.Digits(integer = 10, fraction = 2)'
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Новый доступный остаток плюс резерв заказов CREATED/PAYMENT_PENDING не должен превышать 2147483647; иначе VALIDATION_ERROR.
        category:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^(?![\s\S]*\x00)[\s\S]*\S[\s\S]*$
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          nullable: true
          description: При создании отсутствие/null означает текущего пользователя. Назначать другого владельца
            может только ADMIN. При PUT отсутствие/null сохраняет владельца.
      description: Полное представление для записи; PUT заменяет поля, отсутствие description означает null. Цены
        с точностью до 2 знаков. Неизвестные поля запрещены.
      example:
        name: Книга, новое издание
        description: null
        price: 120.0
        stock: 10
        category: Books
        status: ACTIVE
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?![\s\S]*\x00)[\s\S]*\S[\s\S]*$
        description:
          type: string
          maxLength: 4000
          pattern: ^[^\x00]*$
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
