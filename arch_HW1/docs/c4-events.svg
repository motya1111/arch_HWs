<text x="1205" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="middle" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">AMQP via RabbitMQ</text>
