<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1210" viewBox="0 0 1840 1210" role="img" aria-labelledby="title desc">
<title id="title">Marketplace — C4 Container: асинхронные взаимодействия</title>
<desc id="desc">C4 Container архитектура маркетплейса. Приватная база данных для каждого доменного сервиса. Сплошные связи синхронные, пунктирные — события через RabbitMQ.</desc>
<defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#174a78"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a75a00"/></marker></defs>
<rect width="1840" height="1210" fill="#ffffff"/>
<text x="45" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#183449" text-anchor="start" font-weight="700">Marketplace · C4 Container · события</text>
<text x="45" y="85" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183449" text-anchor="start">Дополнительный вид той же системы: только производители и потребители событий. БД и API показаны на основном виде.</text>
<rect x="35" y="130" width="1770" height="1000" rx="12" fill="#f6f9fc" stroke="#748b9c" stroke-width="2" stroke-dasharray="10 6"/>
<text x="59" y="164" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#183449" text-anchor="start" font-weight="700">Marketplace [Software System]</text>
