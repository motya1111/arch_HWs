<text x="1035.0" y="629" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Уведомления о заказах</text>
<text x="1035.0" y="654" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">и повторные попытки отправки</text>
