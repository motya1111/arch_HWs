<text x="295.0" y="925" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e8f0f8" text-anchor="middle">[Container | Python / FastAPI]</text>
<text x="295.0" y="959" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Платежи, учёт операций</text>
<text x="295.0" y="984" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">возвраты и интеграция с PSP</text>
<rect x="840" y="530" width="390" height="170" rx="10" fill="#174a78" stroke="#ffffff" stroke-width="2"/>
<text x="1035.0" y="565" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="700">Notifications Service</text>
