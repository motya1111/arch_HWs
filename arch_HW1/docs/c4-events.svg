<text x="675" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="middle" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">CatalogUpdated · карточки, цены, доступность</text>
<text x="675" y="461" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="middle" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">AMQP 0-9-1 via RabbitMQ</text>
<polyline points="935,400 935,530" fill="none" stroke="#a75a00" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#async)"/>
<text x="952" y="486" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="start" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">UserContactsUpdated</text>
<text x="952" y="510" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="start" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">AMQP via RabbitMQ</text>
<polyline points="490,945 1310,945" fill="none" stroke="#a75a00" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#async)"/>
<text x="870" y="904" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="middle" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PaymentStatusChanged · оплата / возврат</text>
<text x="870" y="928" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="middle" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">AMQP 0-9-1 via RabbitMQ</text>
<polyline points="1505,860 1505,615 1230,615" fill="none" stroke="#a75a00" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#async)"/>
<text x="1525" y="769" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="start" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">OrderStatusChanged</text>
<text x="1525" y="793" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a75a00" text-anchor="start" stroke="#f6f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">AMQP via RabbitMQ</text>
<text x="75" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183449" text-anchor="start">Удаление профиля передаётся в оба потока Users: Feed и Notifications очищают свои проекции.</text>
<text x="45" y="1174" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a75a00" text-anchor="start">Пунктирная стрелка — логический поток события от производителя к потребителю. Очереди долговечные, доставка at least once.</text>
