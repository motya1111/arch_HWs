<text x="905.0" y="265" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="700">Users Service</text>
<text x="905.0" y="295" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e8f0f8" text-anchor="middle">[Container | Python / FastAPI]</text>
<text x="905.0" y="329" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Учётные записи, роли, контакты</text>
<text x="905.0" y="354" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">и выбранные категории интересов</text>
<rect x="100" y="530" width="390" height="170" rx="10" fill="#174a78" stroke="#ffffff" stroke-width="2"/>
<text x="295.0" y="565" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="700">Catalog Service</text>
<text x="295.0" y="595" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e8f0f8" text-anchor="middle">[Container | Python / FastAPI]</text>
<text x="295.0" y="629" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Предложения, цены, остатки</text>
<text x="295.0" y="654" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">и резервирование товаров</text>
<rect x="1310" y="230" width="390" height="170" rx="10" fill="#174a78" stroke="#ffffff" stroke-width="2"/>
<text x="1505.0" y="265" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="700">Feed Service</text>
<text x="1505.0" y="295" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e8f0f8" text-anchor="middle">[Container | Python / FastAPI]</text>
<text x="1505.0" y="329" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Персональная лента, просмотры</text>
<text x="1505.0" y="354" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">и проекция опубликованных товаров</text>
